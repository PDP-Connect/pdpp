# Single release channel: 0.x versions released from `main` to npm's default
# `latest` dist-tag. There is no prerelease branch — semver 0.x already signals
# prelaunch, and a second moving branch proved to be pure drift risk.
branches:
  - name: main
tagFormat: "v${version}"
preset: "conventionalcommits"
# @pdpp/cli, @pdpp/mcp-server, and @pdpp/read-core used to publish from a
# single shared version stream. To keep the release-notes per-package
# readable, this defined typed sections per Conventional Commit scope so
# e.g. `feat(cli): ...` landed under "Features (@pdpp/cli)", with commits
# that don't carry a recognised scope falling back to the generic sections.
# See openspec/changes/publish-pdpp-local-collector/design.md §5.
#
# @pdpp/local-collector, @pdpp/cli, @pdpp/mcp-server, and @pdpp/read-core
# have all since left this shared stream — local-collector when its package
# moved to the data-connect repo, and cli/mcp-server/read-core when Move B
# relocated the reference implementation there too. Release and publishing
# responsibility for all four now travels with data-connect, not this
# monorepo (no @semantic-release/npm pkgRoot entries remain below). Every
# scope section is kept only so historical commits (made while these
# packages still published from here) still parse into a readable section
# instead of falling back to a generic one.
plugins:
  - - "@semantic-release/commit-analyzer"
    - preset: conventionalcommits
      presetConfig:
        types:
          - type: feat
            scope: local-collector
            section: "Features (@pdpp/local-collector)"
          - type: fix
            scope: local-collector
            section: "Bug Fixes (@pdpp/local-collector)"
          - type: perf
            scope: local-collector
            section: "Performance Improvements (@pdpp/local-collector)"
          - type: feat
            scope: cli
            section: "Features (@pdpp/cli)"
          - type: fix
            scope: cli
            section: "Bug Fixes (@pdpp/cli)"
          - type: perf
            scope: cli
            section: "Performance Improvements (@pdpp/cli)"
          - type: feat
            scope: mcp-server
            section: "Features (@pdpp/mcp-server)"
          - type: fix
            scope: mcp-server
            section: "Bug Fixes (@pdpp/mcp-server)"
          - type: perf
            scope: mcp-server
            section: "Performance Improvements (@pdpp/mcp-server)"
          - type: feat
            scope: read-core
            section: "Features (@pdpp/read-core)"
          - type: fix
            scope: read-core
            section: "Bug Fixes (@pdpp/read-core)"
          - type: perf
            scope: read-core
            section: "Performance Improvements (@pdpp/read-core)"
          - type: feat
            section: "Features"
          - type: fix
            section: "Bug Fixes"
          - type: perf
            section: "Performance Improvements"
          - type: revert
            section: "Reverts"
          - type: docs
            section: "Documentation"
            effect: hidden
          - type: style
            section: "Styles"
            effect: hidden
          - type: chore
            section: "Miscellaneous Chores"
            effect: hidden
          - type: refactor
            section: "Code Refactoring"
            effect: hidden
          - type: test
            section: "Tests"
            effect: hidden
          - type: build
            section: "Build System"
            effect: hidden
          - type: ci
            section: "Continuous Integration"
            effect: hidden
  - - "@semantic-release/release-notes-generator"
    - preset: conventionalcommits
      presetConfig:
        types:
          - type: feat
            scope: local-collector
            section: "Features (@pdpp/local-collector)"
          - type: fix
            scope: local-collector
            section: "Bug Fixes (@pdpp/local-collector)"
          - type: perf
            scope: local-collector
            section: "Performance Improvements (@pdpp/local-collector)"
          - type: feat
            scope: cli
            section: "Features (@pdpp/cli)"
          - type: fix
            scope: cli
            section: "Bug Fixes (@pdpp/cli)"
          - type: perf
            scope: cli
            section: "Performance Improvements (@pdpp/cli)"
          - type: feat
            scope: mcp-server
            section: "Features (@pdpp/mcp-server)"
          - type: fix
            scope: mcp-server
            section: "Bug Fixes (@pdpp/mcp-server)"
          - type: perf
            scope: mcp-server
            section: "Performance Improvements (@pdpp/mcp-server)"
          - type: feat
            scope: read-core
            section: "Features (@pdpp/read-core)"
          - type: fix
            scope: read-core
            section: "Bug Fixes (@pdpp/read-core)"
          - type: perf
            scope: read-core
            section: "Performance Improvements (@pdpp/read-core)"
          - type: feat
            section: "Features"
          - type: fix
            section: "Bug Fixes"
          - type: perf
            section: "Performance Improvements"
          - type: revert
            section: "Reverts"
          - type: docs
            section: "Documentation"
            effect: hidden
          - type: style
            section: "Styles"
            effect: hidden
          - type: chore
            section: "Miscellaneous Chores"
            effect: hidden
          - type: refactor
            section: "Code Refactoring"
            effect: hidden
          - type: test
            section: "Tests"
            effect: hidden
          - type: build
            section: "Build System"
            effect: hidden
          - type: ci
            section: "Continuous Integration"
            effect: hidden
  - - "@semantic-release/github"
    - successComment: false
      failComment: false
      failTitle: false
      labels: false
      releasedLabels: false
  - - "@semantic-release/exec"
    - publishCmd: "node --import tsx scripts/semantic-release-github-output.ts publish ${nextRelease.version} ${nextRelease.gitTag}"
