packages:
  - "apps/*"
  - "packages/*"
# @pdpp/collector-runtime and @pdpp/connector-protocol left this monorepo for
# data-connect (PDP-Connect/data-connect). This repo consumes them as vendored
# tarballs (see vendor/README.md for provenance and
# scripts/check-pdpp-vendored-package-pins.ts for the pin verification), not a
# git dependency — the two packages are lockstep-versioned by data-connect's
# semantic-release pipeline, so both tarballs always carry the same package
# version, and collector-runtime's packed package.json pins its
# connector-protocol dependency to that exact version (never "*").
overrides:
  conventional-changelog-writer: 9.2.1
  # collector-runtime pins connector-protocol to 1.0.0. Resolve that version
  # from the vendored tarball because the package is private. Keep direct
  # file dependencies out of this override: pnpm 12 otherwise compares their
  # package-relative paths with workspace-relative paths on frozen installs.
  # reference-contract overrides to this repo's own real package
  # (not data-connect's minimal same-named stand-in — see its README for why
  # that distinction matters).
  "@pdpp/connector-protocol@1.0.0": "file:./vendor/pdpp-connector-protocol-1.0.0.tgz"
  "@pdpp/reference-contract": "workspace:*"
# React's own package ships no types, so a dependency's `import * as React from
# "react"` resolves types by walking up from its isolated pnpm store directory —
# where `@types/react` is not reachable. next-themes' `ThemeProviderProps extends
# React.PropsWithChildren` then degrades to `{}` and every consumer fails with
# "Property 'children' does not exist". Hoisting the React types to the workspace
# root puts them back on that lookup path. Runtime resolution is unaffected.
publicHoistPattern:
  - "@types/react"
  - "@types/react-dom"
childConcurrency: 1
allowBuilds:
  "@pdpp/collector-runtime": true
  "@pdpp/connector-protocol": true
  "@scarf/scarf": false
  "better-sqlite3": true
  "esbuild": true
  "lefthook": false
  "onnxruntime-node": true
  "protobufjs": true
minimumReleaseAgeExclude:
  - lucide-react@1.43.0
  - patchright-core@1.63.0
  - patchright@1.63.0
