# Minimal production Docker Compose for a self-hosted PDPP Core node.
#
#   reference  - the PDPP Authorization Server + Resource Server runtime
#   web        - the operator console (dashboard + proxy in front of the AS/RS)
#   postgres   - durable storage with pgvector (semantic search index)
#
# This is the TEMPLATE a release's publish-selfhost-bundle job reads to
# produce the friend-facing bundle at
# https://github.com/PDP-Connect/pdpp/releases/latest/download/docker-compose.yml
# — that release URL, not a raw fetch of this file from `main`, is the one
# blessed self-service path (see ./README.md). Its reference/web/neko image
# defaults below are digest-pinned by the release pipeline at publish time;
# the `sha-cc07e3a` fallback here only applies if this template file itself
# is fetched directly from the repository, which is a developer/contributor
# path, not the friend-facing one.
#
# This file is intentionally small. The repository-root docker-compose.yml is
# the development/owner stack (connector credentials, fixture mounts, browser
# services) — do not start here if you only want to run a node.
services:
  reference:
    image: ${PDPP_REFERENCE_IMAGE:-ghcr.io/pdp-connect/pdpp/reference:sha-cc07e3a}
    restart: unless-stopped
    environment:
      # The single public origin this node advertises in its OAuth metadata.
      # For anything beyond a local trial, set this to your HTTPS domain.
      PDPP_REFERENCE_MODE: composed
      PDPP_REFERENCE_ORIGIN: ${PDPP_REFERENCE_ORIGIN:-http://localhost:3000}
      # Postgres is the storage backend; the runtime selects it because this
      # database URL is present. Credentials live on the compose-private
      # network only (no published Postgres port).
      PDPP_DATABASE_URL: postgresql://pdpp:${PDPP_POSTGRES_PASSWORD:-pdpp}@postgres:5432/pdpp
      # Required secrets — generate once into .env (see header). The owner
      # password gates the dashboard; the encryption key seals any connector
      # credentials you store, so back it up with the database.
      PDPP_OWNER_PASSWORD: ${PDPP_OWNER_PASSWORD:?generate into .env — see deploy/docker/README.md}
      PDPP_CREDENTIAL_ENCRYPTION_KEY: ${PDPP_CREDENTIAL_ENCRYPTION_KEY:?generate into .env — see deploy/docker/README.md}
      # Semantic search: allow the one-time embedding-model download and cache
      # it on a volume. Set to 0 for a leaner, lexical-only node.
      PDPP_EMBEDDING_DOWNLOAD_ALLOWED: ${PDPP_EMBEDDING_DOWNLOAD_ALLOWED:-1}
      PDPP_EMBEDDING_CACHE_DIR: /var/cache/pdpp/transformers
      # `restart: unless-stopped` above is the real supervisor this asserts;
      # see docker-compose.yml (repo root) for the full rationale. Never set
      # this to 1 without an equivalent restart policy backing it.
      PDPP_LOCAL_TRANSFORMER_SUPERVISOR_RESTART_CONTRACT: "1"
      PDPP_REFERENCE_OPERATIONAL_DEFAULTS: "1"
      # Optional Google Data Portability OAuth app material. Required only to
      # let owners add the API-backed Google Maps Data Portability source.
      GOOGLE_DATAPORTABILITY_CLIENT_ID: ${GOOGLE_DATAPORTABILITY_CLIENT_ID:-}
      GOOGLE_DATAPORTABILITY_CLIENT_SECRET: ${GOOGLE_DATAPORTABILITY_CLIENT_SECRET:-}
      GOOGLE_DATAPORTABILITY_REDIRECT_URI: ${GOOGLE_DATAPORTABILITY_REDIRECT_URI:-}
      GOOGLE_DATAPORTABILITY_RESOURCE_GROUPS: ${GOOGLE_DATAPORTABILITY_RESOURCE_GROUPS:-}
      # Browser surface. Empty by default, which is what makes this node
      # network-only: with no managed connectors the runtime never requires a
      # surface, and browser-backed sources are refused up front at setup
      # instead of failing on the first sync.
      #
      # `docker compose --profile browser up -d` starts the n.eko service below.
      #
      # Only this one is a real choice: which browser-backed connector this
      # node may drive. Empty = network-only. Set it in .env; see the runbook
      # for the exact one-line value.
      PDPP_NEKO_MANAGED_CONNECTORS: ${PDPP_NEKO_MANAGED_CONNECTORS:-}
      # The rest are compose-internal wiring with correct defaults. They are
      # addresses of the `neko` service on this compose network, so an owner
      # never has to look up a container IP. Do not change them unless you are
      # pointing at a browser surface you run yourself.
      # These MUST stay empty unless a managed connector is configured. The
      # runtime treats a present CDP URL as "this deployment has a browser
      # surface", so defaulting them unconditionally would make a node with no
      # n.eko container claim a surface it does not have — and a browser-backed
      # source would be accepted at setup and then fail on the first sync,
      # which is exactly the trap the setup guard exists to prevent.
      #
      # `${VAR:+value}` expands to the value ONLY when VAR is non-empty, so
      # these follow PDPP_NEKO_MANAGED_CONNECTORS automatically: set the
      # connector, get the wiring; leave it empty, stay honestly network-only.
      PDPP_NEKO_BASE_URL: ${PDPP_NEKO_BASE_URL:-${PDPP_NEKO_MANAGED_CONNECTORS:+http://neko:8080/neko}}
      PDPP_NEKO_CDP_HTTP_URL: ${PDPP_NEKO_CDP_HTTP_URL:-${PDPP_NEKO_MANAGED_CONNECTORS:+http://neko:9223}}
      PDPP_NEKO_WINDOW_SETTLE_URL: ${PDPP_NEKO_WINDOW_SETTLE_URL:-${PDPP_NEKO_MANAGED_CONNECTORS:+http://neko:9223/pdpp/window-settle}}
      PDPP_NEKO_PROXY_ALLOWED_HOSTS: ${PDPP_NEKO_PROXY_ALLOWED_HOSTS:-${PDPP_NEKO_MANAGED_CONNECTORS:+neko:8080}}
      PDPP_NEKO_STATIC_PROFILE_KEY: ${PDPP_NEKO_STATIC_PROFILE_KEY:-${PDPP_NEKO_MANAGED_CONNECTORS:-}}
      PDPP_NEKO_SURFACE_MODE: ${PDPP_NEKO_SURFACE_MODE:-${PDPP_NEKO_MANAGED_CONNECTORS:+static}}
      PDPP_NEKO_SURFACE_CAP: ${PDPP_NEKO_SURFACE_CAP:-${PDPP_NEKO_MANAGED_CONNECTORS:+1}}
      PDPP_NEKO_BROWSER_OWNER_MODE: ${PDPP_NEKO_BROWSER_OWNER_MODE:-${PDPP_NEKO_MANAGED_CONNECTORS:+neko-owned}}
    volumes:
      - pdpp-transformers:/var/cache/pdpp/transformers
    depends_on:
      postgres:
        condition: service_healthy
    # Healthy = both protocol listeners answer their public metadata.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:7662/.well-known/oauth-authorization-server >/dev/null && curl -fsS http://localhost:7663/.well-known/oauth-protected-resource >/dev/null",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  # Operator console: the only service published to the host. It proxies the
  # full protocol surface, so one origin (port 3000 by default) fronts the node.
  web:
    image: ${PDPP_WEB_IMAGE:-ghcr.io/pdp-connect/pdpp/web:sha-cc07e3a}
    restart: unless-stopped
    environment:
      PDPP_REFERENCE_MODE: composed
      PDPP_REFERENCE_ORIGIN: ${PDPP_REFERENCE_ORIGIN:-http://localhost:3000}
      PDPP_AS_URL: http://reference:7662
      PDPP_RS_URL: http://reference:7663
      PDPP_OWNER_PASSWORD: ${PDPP_OWNER_PASSWORD:?generate into .env — see deploy/docker/README.md}
      PDPP_ENABLE_DASHBOARD: "1"
    ports:
      - "${PDPP_WEB_PORT:-3000}:3000"
    depends_on:
      reference:
        condition: service_healthy

  postgres:
    image: ${PDPP_POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    restart: unless-stopped
    environment:
      POSTGRES_USER: pdpp
      POSTGRES_PASSWORD: ${PDPP_POSTGRES_PASSWORD:-pdpp}
      POSTGRES_DB: pdpp
    # No published port: Postgres is reachable only from the compose network.
    # If you publish one, change PDPP_POSTGRES_PASSWORD first.
    volumes:
      - pdpp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdpp -d pdpp"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Browser surface for browser-backed sources (ChatGPT, USAA, Amazon, ...).
  #
  # Off by default. `docker compose --profile browser up -d` starts it; without
  # the profile this service is not created and the node stays network-only.
  # It is a separate profile, not a separate compose file, so there is exactly
  # one canonical stack to reason about.
  #
  # These connectors sign in through a REAL browser session the owner can see
  # and click in: the provider may show a bot challenge or a 2FA prompt that
  # only a human can clear. A headless browser cannot do that, and a headed
  # browser inside a container has no screen — which is why this is its own
  # service rather than a flag on the reference container.
  neko:
    # No default tag on purpose: the n.eko image is in the release pipeline but
    # has not been published yet, so there is no registry-proven tag to pin. Set
    # PDPP_NEKO_IMAGE in .env to a locally built image until a release runs;
    # compose fails with this message rather than silently pulling a tag that
    # does not exist.
    # Deliberately has no registry default: the n.eko image is in the release
    # pipeline but not published yet, so there is no proven tag to pin. Set
    # PDPP_NEKO_IMAGE in .env to a locally built image until a release runs.
    # A `:?` guard cannot be used here — compose interpolates every service
    # even when its profile is inactive, so that would break the default
    # network-only stack for owners who never enable the browser profile.
    image: ${PDPP_NEKO_IMAGE:-pdpp-neko-image-not-set}
    profiles: ["browser"]
    restart: unless-stopped
    # Chromium needs more shared memory than Docker's 64MB default or it
    # crashes on non-trivial pages.
    shm_size: 2gb
    environment:
      NEKO_PASSWORD: ${PDPP_NEKO_PASSWORD:-neko}
      NEKO_PASSWORD_ADMIN: ${PDPP_NEKO_PASSWORD_ADMIN:-admin}
      PDPP_NEKO_CDP_PROXY_PORT: "9223"
    # Chromium's profile dir (cookies, IndexedDB, saved login state for
    # ChatGPT/USAA/Amazon/... sign-in) lives at /home/user/.config/chromium
    # inside the container. A project-scoped named volume is the ONLY thing
    # that survives container recreation:
    #   - `docker compose stop`/`start` (no recreate): the container's
    #     writable layer alone would already survive this case, so the
    #     volume adds nothing new here, but does no harm either.
    #   - `docker compose down` + `up` (recreates the container; this is the
    #     upgrade path this README documents as `docker compose pull &&
    #     docker compose up -d`): without this volume, the profile lived only
    #     on the destroyed container's writable layer and was lost. With it,
    #     the named volume outlives the container and is reattached.
    #   - an image rebuild (`docker build ... -t pdpp-neko:local` then
    #     `up -d`, the pre-release path this README documents): same as
    #     above — survives, because the volume is independent of the image.
    #   - `docker compose down --volumes` (this README's documented
    #     teardown): deletes the volume along with Postgres data, by design —
    #     this is the one operation the README already calls out as "deletes
    #     data".
    # Named (not host-bind): a separate operator/development stack (outside
    # this file) manages a browser-surface allocator with its own
    # per-surface host-bind profile storage, for isolating concurrently
    # allocated browser surfaces from each other. That mechanism is
    # unrelated to and unchanged by this volume — this file stays the one
    # blessed self-service stack with no cross-references to it.
    volumes:
      - pdpp-neko-profile:/home/user/.config/chromium
    # No published port. The owner reaches this surface through the console
    # origin, so the browser is not exposed to the host or the network.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9223/json/version >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # Public HTTPS ingress for hosted AI clients (ChatGPT, Claude.ai). Off by
  # default. `docker compose --profile tunnel up -d` starts it; without the
  # profile this service is not created and the node stays loopback-only,
  # which is fine for Claude Code but cannot serve a hosted client (they fetch
  # the MCP URL from their own servers and cannot reach a private address).
  #
  # This is Cloudflare's own `cloudflared` image running a NAMED (persistent)
  # tunnel — `tunnel run`, not the zero-setup Quick Tunnel (`cloudflared
  # tunnel --url ...`, `tunnel --hello-world`, etc). A named tunnel's public
  # hostname REQUIRES a domain added to a Cloudflare account as a zone — this
  # is Cloudflare's own documented prerequisite ("A domain on Cloudflare
  # (required to publish applications)", developers.cloudflare.com/tunnel/setup)
  # — Cloudflare does not issue a free subdomain for a named tunnel the way it
  # does for the ephemeral, testing-only Quick Tunnel (*.trycloudflare.com).
  # If you do not own a domain, see ./README.md#public-https-for-chatgpt-and-claudeai
  # for a stable alternative that needs no owned domain (ngrok's free,
  # automatically-assigned Dev Domain — not a name you choose) or the
  # ephemeral Quick Tunnel path for a short trial.
  #
  # Setup (see ./README.md#public-https-for-chatgpt-and-claudeai for the full
  # walkthrough): add your domain to Cloudflare, run `cloudflared tunnel
  # login` and `cloudflared tunnel create pdpp` once on any machine, route a
  # hostname on that domain to the tunnel, then set CLOUDFLARE_TUNNEL_TOKEN
  # and PDPP_REFERENCE_ORIGIN in .env to that hostname before starting this
  # profile.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel run
    # A `:?` guard cannot be used here — compose interpolates every service's
    # environment even when its profile is inactive, so a required variable
    # would break the default network-only stack for owners who never enable
    # the tunnel profile (the same reason the neko service below cannot use
    # `:?` on PDPP_NEKO_IMAGE). Empty is a real, documented failure the
    # cloudflared image itself reports at startup, not a silent no-op.
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_started
    # No published port: cloudflared makes an OUTBOUND connection to
    # Cloudflare's edge and reaches `web` over the private compose network.
    # No inbound firewall rule or open port is required on the host.

volumes:
  pdpp-postgres-data:
  pdpp-transformers:
  pdpp-neko-profile:
