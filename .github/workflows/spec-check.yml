name: spec-check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/spec-check.yml"
      - "apps/site/content/docs/spec-*.md"
      - "apps/site/content/docs/README.md"
      - "package.json"
      - "scripts/spec-check.ts"
      - "scripts/spec-date-check.ts"
      - "spec-*.md"
  pull_request:
    paths:
      - ".github/workflows/spec-check.yml"
      - "apps/site/content/docs/spec-*.md"
      - "apps/site/content/docs/README.md"
      - "package.json"
      - "scripts/spec-check.ts"
      - "scripts/spec-date-check.ts"
      - "spec-*.md"
  workflow_dispatch: {}

concurrency:
  group: spec-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-check:
    name: root/site spec drift
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # spec:dates walks full file history to find the last substantive
          # commit per spec — a shallow (depth-1) checkout would see no
          # history and silently skip every file.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        env:
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Check spec docs drift
        run: pnpm spec:check

      - name: Check pull-request spec Date headers are not stale
        if: github.event_name == 'pull_request'
        run: pnpm spec:dates -- --base "${{ github.event.pull_request.base.sha }}"

      - name: Check all spec Date headers are not stale
        if: github.event_name != 'pull_request'
        run: pnpm spec:dates
