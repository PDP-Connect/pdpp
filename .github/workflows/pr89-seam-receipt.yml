name: pr89-seam-receipt

on:
  pull_request:
    paths:
      - "reference-implementation/test/seam-spike/**"
      - "reference-implementation/package.json"
      - ".github/workflows/pr89-seam-receipt.yml"
  push:
    branches: [main]
    paths:
      - "reference-implementation/test/seam-spike/**"
      - "reference-implementation/package.json"
      - ".github/workflows/pr89-seam-receipt.yml"

jobs:
  pr89-seam-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter pdpp-reference-implementation test:seam:pr89:receipt
