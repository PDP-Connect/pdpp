name: publish-supporters

on:
  # The private register repository sends this event on every push to its
  # signatures branch, so publication follows a confirmation within minutes.
  # The nightly schedule stays as the safety net.
  repository_dispatch:
    types:
      - register-updated
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      base_branch:
        default: main
        description: Branch that receives the generated register.
        required: false
        type: string
      open_pr:
        default: true
        description: Open a pull request when the publisher branch changes.
        required: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-supporters
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      PUBLISH_BASE: ${{ inputs.base_branch || 'main' }}
      PUBLISH_BRANCH: publish/supporters
      PUBLISH_OPEN_PR: ${{ github.event_name == 'workflow_dispatch' && inputs.open_pr == false && 'false' || 'true' }}
    steps:
      - name: Checkout public repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: pdpp

      - name: Checkout private register branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: supporters-private
          persist-credentials: false
          ref: signatures
          repository: PDP-Connect/supporters-private
          token: ${{ secrets.PDPP_PRIVATE_REPO_TOKEN }}

      - name: Start the publisher branch from its base
        working-directory: pdpp
        run: |
          set -euo pipefail
          if [ "$PUBLISH_BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "::error::Publisher branch $PUBLISH_BRANCH must not be the repository default branch $DEFAULT_BRANCH."
            exit 1
          fi
          git fetch --no-tags origin "refs/heads/$PUBLISH_BASE:refs/remotes/origin/$PUBLISH_BASE"
          if git ls-remote --exit-code --heads origin "refs/heads/$PUBLISH_BRANCH" > /dev/null; then
            git fetch --no-tags origin "refs/heads/$PUBLISH_BRANCH:refs/remotes/origin/$PUBLISH_BRANCH"
            echo "PUBLISH_BRANCH_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "PUBLISH_BRANCH_EXISTS=false" >> "$GITHUB_ENV"
          fi
          git checkout --force -B "$PUBLISH_BRANCH" "origin/$PUBLISH_BASE"

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Build public supporters register
        run: node pdpp/apps/site/scripts/publish-supporters.mjs supporters-private pdpp/apps/site/public/principles/supporters.json

      - name: Summarize public register changes
        working-directory: pdpp
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_ENV"
          import { execFileSync } from "node:child_process";
          import { readFile } from "node:fs/promises";

          const registerPath = "apps/site/public/principles/supporters.json";
          const base = JSON.parse(
            execFileSync("git", ["show", `origin/${process.env.PUBLISH_BASE}:${registerPath}`], { encoding: "utf8" })
          );
          const published = JSON.parse(await readFile(registerPath, "utf8"));
          const entry = (value) => JSON.stringify(value);
          const baseEntries = new Set(base.map(entry));
          const publishedEntries = new Set(published.map(entry));
          const rowsAdded = [...publishedEntries].filter((value) => !baseEntries.has(value)).length;
          const rowsRemoved = [...baseEntries].filter((value) => !publishedEntries.has(value)).length;

          console.log(`PUBLISH_ROWS_ADDED=${rowsAdded}`);
          console.log(`PUBLISH_ROWS_REMOVED=${rowsRemoved}`);
          console.log(`PUBLISH_TOTAL_ROWS=${published.length}`);
          console.log(`PUBLISH_RUN_URL=${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`);
          NODE

      - name: Commit and publish changed register
        id: publish
        working-directory: pdpp
        run: |
          set -euo pipefail
          register_matches_base=false
          register_matches_branch=false
          if git diff --quiet -- apps/site/public/principles/supporters.json; then
            register_matches_base=true
          fi
          if [ "$PUBLISH_BRANCH_EXISTS" = "true" ] && git diff --quiet "origin/$PUBLISH_BRANCH" -- apps/site/public/principles/supporters.json; then
            register_matches_branch=true
          fi
          action="$(PUBLISH_PR_ACTION=decide PUBLISH_REGISTER_MATCHES_BASE="$register_matches_base" PUBLISH_REGISTER_MATCHES_BRANCH="$register_matches_branch" node .github/scripts/manage-supporters-pr.mjs)"
          case "$action" in
            retire)
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "manage_pr=false" >> "$GITHUB_OUTPUT"
              echo "retire=true" >> "$GITHUB_OUTPUT"
              echo "Supporters register now equals $PUBLISH_BASE; retire any publication branch and pull request."
              exit 0
              ;;
            unchanged)
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "manage_pr=true" >> "$GITHUB_OUTPUT"
              echo "retire=false" >> "$GITHUB_OUTPUT"
              echo "Supporters register already matches $PUBLISH_BRANCH."
              exit 0
              ;;
            publish) ;;
            *)
              echo "::error::Unexpected supporters publication action: $action"
              exit 1
              ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/site/public/principles/supporters.json
          git commit -s -m "chore(site): publish supporters register"
          git push --force origin "HEAD:refs/heads/$PUBLISH_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "manage_pr=true" >> "$GITHUB_OUTPUT"
          echo "retire=false" >> "$GITHUB_OUTPUT"

      - name: Record pull request token path
        env:
          PUBLISH_PR_TOKEN: ${{ secrets.PDPP_PUBLISH_PR_TOKEN }}
        run: |
          if [ -n "$PUBLISH_PR_TOKEN" ]; then
            echo "Supporters pull request token: PDPP_PUBLISH_PR_TOKEN." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Supporters pull request token: github.token fallback." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Close the obsolete supporters pull request
        if: steps.publish.outputs.retire == 'true'
        working-directory: pdpp
        env:
          GH_TOKEN: ${{ secrets.PDPP_PUBLISH_PR_TOKEN || github.token }}
          PUBLISH_PR_ACTION: retire
        run: node .github/scripts/manage-supporters-pr.mjs

      - name: Create or update the supporters pull request
        if: steps.publish.outputs.manage_pr == 'true'
        working-directory: pdpp
        env:
          GH_TOKEN: ${{ secrets.PDPP_PUBLISH_PR_TOKEN || github.token }}
        run: node .github/scripts/manage-supporters-pr.mjs
