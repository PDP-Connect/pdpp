name: reference-implementation

# Move B (2026-09-02): reference-implementation/, apps/console/, and three
# companion packages exclusive to that server/dashboard (cli, mcp-server,
# read-core) moved to their canonical home, PDP-Connect/data-connect
# (data-connect#42, #43, #44, #46), and were deleted from this repo in the
# same PR that added this file's replacement content. This workflow used to
# run the full reference-implementation/console CI suite; now it exists only
# to fail loudly if any of those paths reappear here, preventing a second,
# drifting copy from creeping back in.
#
# packages/display, packages/pdpp-brand, packages/pdpp-brand-react,
# packages/operator-ui, and packages/list-envelope are deliberately NOT in
# this guard's path list -- they were kept in this repo (apps/site imports
# them directly), so their reappearance is not an error.

on:
  pull_request: {}
  merge_group: {}
  workflow_dispatch: {}

concurrency:
  group: reference-implementation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-reappearance-guard:
    name: reference implementation must not reappear here
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fail if any moved path exists in the working tree
        run: |
          set -euo pipefail
          FOUND=0
          for p in \
            reference-implementation \
            apps/console \
            packages/cli \
            packages/mcp-server \
            packages/read-core
          do
            if [ -e "$p" ]; then
              echo "::error::$p has reappeared -- this code's canonical home is PDP-Connect/data-connect. Do not re-add it here."
              FOUND=1
            fi
          done
          exit "$FOUND"
