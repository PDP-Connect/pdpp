name: test-scratch-lifecycle

# The lifecycle oracle deliberately starts without an inherited owner so it can
# verify outer-owner allocation, signal, and recovery behavior itself.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-scratch-lifecycle.yml"
      - ".github/workflows/**"
      - "**/*.cjs"
      - "**/*.cts"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.mts"
      - "**/*.sh"
      - "**/*.ts"
      - "**/*.tsx"
      - "scripts/test-scratch/**"
      - "scripts/test-scratch/tsconfig.json"
      - "package.json"
      - "**/package.json"
      - "pnpm-lock.yaml"
      - "test-accounting.manifest.json"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/test-scratch-lifecycle.yml"
      - ".github/workflows/**"
      - "**/*.cjs"
      - "**/*.cts"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.mts"
      - "**/*.sh"
      - "**/*.ts"
      - "**/*.tsx"
      - "scripts/test-scratch/**"
      - "scripts/test-scratch/tsconfig.json"
      - "package.json"
      - "**/package.json"
      - "pnpm-lock.yaml"
      - "test-accounting.manifest.json"
  workflow_dispatch: {}

concurrency:
  group: test-scratch-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    name: lifecycle + canonical-entrypoint ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        env:
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Scoped strict TypeScript
        run: pnpm exec tsc --project scripts/test-scratch/tsconfig.json --pretty false

      - name: Require bubblewrap
        # The /tmp visibility probe runs with TEST_SANDBOX_REQUIRE=1. Without a working bubblewrap it must fail,
        # never fall back to the host /tmp, so install it, lift Ubuntu's unprivileged-userns restriction and
        # prove it here with the flags test-sandbox uses.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --dev-bind / / --tmpfs /tmp --unshare-net true
          echo "bubblewrap verified: $(bwrap --version)"

      - name: Lifecycle owner oracle
        # The whole file runs in well under a minute; a hung process must fail the step, not the job.
        timeout-minutes: 5
        run: pnpm exec tsx --test scripts/test-scratch/run-command.test.ts

      - name: Canonical-entrypoint ratchet
        run: pnpm test:scratch -- pnpm exec tsx --test scripts/test-scratch/canonical-entrypoints.test.ts
