name: semantic-release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: semantic-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-version:
    name: resolve next version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    outputs:
      new-release-published: ${{ steps.version.outputs.new-release-published }}
      new-release-version: ${{ steps.version.outputs.new-release-version }}
      new-release-git-tag: ${{ steps.version.outputs.new-release-git-tag }}
      new-release-major-minor: ${{ steps.version.outputs.new-release-major-minor }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies
        env:
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Determine next version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          pnpm exec semantic-release --dry-run 2>&1 | tee "$RUNNER_TEMP/semantic-release-dry-run.log"
          node --import tsx scripts/semantic-release-github-output.ts dry-run "$RUNNER_TEMP/semantic-release-dry-run.log"

  quality:
    name: release quality checks
    needs: resolve-version
    if: needs.resolve-version.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: "pnpm"

      # --ignore-scripts is deliberate here: a normal `pnpm install` runs every
      # workspace package's `prepare` script, and packages/cli's `prepare`
      # runs `pnpm build`, which REGENERATES packages/cli/src/ref/
      # list-envelope.ts from packages/list-envelope/src/index.ts before any
      # later drift check would ever see the tracked file's real committed
      # state. Checking drift after a scripted install would silently
      # normalize (and thus never catch) exactly the drift this check exists
      # to find. node_modules from this pass is sufficient for
      # generated-artifacts:check (tsx + tsc, no package builds needed).
      - name: Install dependencies (no lifecycle scripts, for drift check)
        env:
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check generated artifacts are not drifted (before any build/prepack normalizes them)
        run: pnpm generated-artifacts:check

      - name: Install dependencies
        env:
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Verify generated reference contract
        run: pnpm reference-contract:check-generated

      - name: Typecheck reference implementation
        run: pnpm --dir reference-implementation run typecheck

      - name: Check spec docs drift
        run: pnpm spec:check

      - name: Check package release policy
        run: pnpm release:policy-check

      - name: Test package release policy checks
        run: pnpm release:policy-check:test

      - name: Test dist-tag posture classifier
        run: pnpm release:dist-tag-check:test

      - name: Typecheck operator console app
        run: pnpm --dir apps/console run types:check

      - name: Verify CLI package
        run: pnpm --filter @pdpp/cli run verify

      - name: Verify MCP server package
        run: pnpm --filter @pdpp/mcp-server run verify

      - name: Verify read-core package
        run: pnpm --filter @pdpp/read-core run verify

  validate-release-images:
    name: validate release image ${{ matrix.image }}
    needs: resolve-version
    if: needs.resolve-version.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: reference
            target: reference
            title: PDPP reference AS/RS
            description: PDPP reference authorization server and resource server
          - image: reference-browser
            target: reference-browser
            title: PDPP reference AS/RS (browser-capable)
            description: PDPP reference AS/RS with Patchright/Chromium for browser-backed connectors (ChatGPT, USAA, ...)
          - image: web
            target: console
            title: PDPP reference operator console
            description: PDPP browser-facing reference operator console
          - image: core
            target: core
            title: PDPP Core node
            description: PDPP platform-neutral single-container Core node with console and loopback AS/RS

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image name
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          echo "PDPP_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      # No QEMU here: this validate build is amd64-only (see platforms below),
      # so cross-arch emulation isn't needed. The publish-images job keeps QEMU
      # because it builds multi-arch.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.PDPP_IMAGE }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.resolve-version.outputs.new-release-version }}
          tags: |
            type=raw,value=${{ needs.resolve-version.outputs.new-release-version }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          cache-from: |
            type=gha,scope=${{ matrix.target }}-release
            type=gha,scope=reference-release
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-release
          context: .
          file: ./Dockerfile
          build-args: |
            PDPP_REFERENCE_REVISION=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          # amd64-only for this validate build (push: false). It's a
          # constructability smoke test, and the arm64 Chromium/Patchright build
          # adds 10-24 min with no CI value here. The publish-images job below
          # stays multi-arch (linux/amd64,linux/arm64).
          platforms: linux/amd64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          target: ${{ matrix.target }}

  release:
    name: publish GitHub and npm release
    needs: [resolve-version, quality, publish-candidate-images]
    if: needs.resolve-version.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    outputs:
      published: ${{ steps.semantic-release.outputs.new-release-published }}
      version: ${{ steps.semantic-release.outputs.new-release-version }}
      git-tag: ${{ steps.semantic-release.outputs.new-release-git-tag }}
      major-minor: ${{ steps.semantic-release.outputs.new-release-major-minor }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies
        env:
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Run semantic-release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release

  # Publishes the candidate images BEFORE semantic-release creates the GitHub
  # release and git tag. Ordering is the whole point: when this job ran after
  # `release`, an image build that failed left a published GitHub release and
  # tag advertising a version whose images never existed, and the only repair
  # was to delete a public release. Building first makes the failure mode
  # "no release happened", which is recoverable by pushing again.
  #
  # No release-looking tag is written here. `candidate-<version>-sha-<rev>`
  # cannot be mistaken for the final `<version>` release tag - a reader who
  # sees it in a registry listing knows on sight that it precedes a release,
  # not that it is one. `latest` is also absent: a moving channel tag must not
  # advertise a version that semantic-release has not yet committed to.
  #
  # promote-release-images below does not read this tag at all. It reads the
  # manifest digest recorded by the `id: build` step and carried forward as a
  # durable artifact, so promotion binds to the exact bytes this job produced
  # rather than to any mutable tag - candidate or otherwise.
  publish-candidate-images:
    name: publish candidate image ${{ matrix.image }}
    needs: [resolve-version, quality, validate-release-images]
    if: needs.resolve-version.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: reference
            target: reference
            title: PDPP reference AS/RS
            description: PDPP reference authorization server and resource server
          - image: reference-browser
            target: reference-browser
            title: PDPP reference AS/RS (browser-capable)
            description: PDPP reference AS/RS with Patchright/Chromium for browser-backed connectors (ChatGPT, USAA, ...)
          - image: web
            target: console
            title: PDPP reference operator console
            description: PDPP browser-facing reference operator console
          - image: core
            target: core
            title: PDPP Core node
            description: PDPP platform-neutral single-container Core node with console and loopback AS/RS

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image name
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          echo "PDPP_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.PDPP_IMAGE }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.resolve-version.outputs.new-release-version }}
          tags: |
            type=raw,value=candidate-${{ needs.resolve-version.outputs.new-release-version }}-sha-${{ github.sha }}
            type=sha,prefix=sha-

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          cache-from: |
            type=gha,scope=${{ matrix.target }}-release
            type=gha,scope=reference-release
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-release
          context: .
          file: ./Dockerfile
          build-args: |
            PDPP_REFERENCE_REVISION=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          target: ${{ matrix.target }}

      # Durable per-image record of the exact manifest this job pushed.
      # promote-release-images consumes this artifact rather than re-resolving
      # a tag, so promotion is bound to these bytes even if a tag is later
      # moved, reused, or raced by a concurrent operator action.
      - name: Record candidate digest
        env:
          IMAGE_NAME: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate-digests"
          printf '%s' "$DIGEST" > "$RUNNER_TEMP/candidate-digests/${IMAGE_NAME}"

      - name: Upload candidate digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-digest-${{ matrix.image }}
          path: ${{ runner.temp }}/candidate-digests/${{ matrix.image }}
          retention-days: 14
          if-no-files-found: error

  # Creates the final `<version>` and `latest` tags from the EXACT manifest
  # digest publish-candidate-images recorded, once semantic-release has
  # actually created the release. This is a registry-side manifest copy, not a
  # rebuild: `docker buildx imagetools create -t <dst> <src>` copies the
  # source manifest list by digest, so both final tags are guaranteed to be
  # the same bytes as the candidate build - multi-arch entries, SBOM and
  # provenance attestations included. Rebuilding here would instead produce a
  # differently-built image under the release tags that no candidate build
  # ever produced.
  #
  # Promotion reads the digest artifact, never a tag. A version tag, a
  # candidate tag, or `latest` can all be moved, reused, or raced by a
  # concurrent operator action without changing what gets promoted here - the
  # digest recorded at build time is the only source of truth.
  promote-release-images:
    name: promote ${{ matrix.image }} to the release channel
    needs: [release, publish-candidate-images]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        image: [reference, reference-browser, web, core]

    steps:
      - name: Compute image name
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          echo "PDPP_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      - name: Download recorded candidate digest
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: candidate-digest-${{ matrix.image }}
          path: ${{ runner.temp }}/candidate-digests

      - name: Read candidate digest
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          set -euo pipefail
          digest="$(cat "$RUNNER_TEMP/candidate-digests/${IMAGE_NAME}")"
          if [ -z "$digest" ]; then
            echo "::error::empty candidate digest for ${IMAGE_NAME}" >&2
            exit 1
          fi
          echo "CANDIDATE_DIGEST=${digest}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Fail before touching the release channel if the recorded digest no
      # longer resolves. Without this, a registry-retention or typo problem
      # would surface as a confusing imagetools error after the release
      # already exists.
      - name: Verify the recorded candidate digest exists
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${PDPP_IMAGE}@${CANDIDATE_DIGEST}" > /dev/null

      - name: Promote candidate digest to the version tag
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${PDPP_IMAGE}:${VERSION}" \
            "${PDPP_IMAGE}@${CANDIDATE_DIGEST}"

      - name: Promote candidate digest to latest
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${PDPP_IMAGE}:latest" \
            "${PDPP_IMAGE}@${CANDIDATE_DIGEST}"

      # Proves the promotion actually landed: both the version tag and
      # `latest` must now resolve to the exact digest that was recorded at
      # build time. A silent no-op or a partial copy fails here rather than
      # shipping a stale or divergent tag to every operator whose onboarding
      # docs name it.
      - name: Verify the version tag and latest resolve to the recorded digest
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          version_digest="$(docker buildx imagetools inspect \
            --format '{{json .Manifest.Digest}}' "${PDPP_IMAGE}:${VERSION}")"
          latest_digest="$(docker buildx imagetools inspect \
            --format '{{json .Manifest.Digest}}' "${PDPP_IMAGE}:latest")"
          recorded_digest="\"${CANDIDATE_DIGEST}\""
          echo "recorded ${PDPP_IMAGE}@${CANDIDATE_DIGEST}"
          echo "version  ${PDPP_IMAGE}:${VERSION} -> ${version_digest}"
          echo "latest   ${PDPP_IMAGE}:latest -> ${latest_digest}"
          if [ "${version_digest}" != "${recorded_digest}" ]; then
            echo "::error::${PDPP_IMAGE}:${VERSION} does not resolve to the recorded candidate digest" >&2
            exit 1
          fi
          if [ "${latest_digest}" != "${recorded_digest}" ]; then
            echo "::error::${PDPP_IMAGE}:latest does not resolve to the recorded candidate digest" >&2
            exit 1
          fi

  # Aggregate gate over the whole release channel. Each promote-release-images
  # matrix leg proves its own image, but `fail-fast: false` means one image's
  # transient failure does not stop the others - so the release can otherwise
  # end with three images promoted and one left on the previous release with
  # no single job whose failure says so. This job re-verifies all four images
  # against their recorded candidate digests after the matrix completes, so a
  # partial promotion fails the workflow run as a whole rather than only the
  # one matrix leg that hit it. It performs no promotion itself: recovery from
  # a partial promotion is re-running the failed promote-release-images matrix
  # legs (or the whole job) from the Actions UI, which is idempotent because
  # `imagetools create` is a manifest copy, not a rebuild.
  verify-release-channel:
    name: verify release channel is fully promoted
    needs: [release, promote-release-images]
    # always() is required here, not just needs.release.outputs.published:
    # promote-release-images runs with fail-fast: false, and GitHub Actions'
    # default job condition is needs.*.result == 'success' for every entry in
    # `needs`. Without always(), one failed promotion matrix leg would mark
    # promote-release-images as failed and skip this job entirely - the exact
    # partial-promotion case this gate exists to catch would never run it.
    if: always() && needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download recorded candidate digests
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: candidate-digest-*
          path: ${{ runner.temp }}/candidate-digests
          merge-multiple: false

      - name: Verify every release image's version and latest tags match its recorded digest
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          failed=0
          for image in reference reference-browser web core; do
            pdpp_image="ghcr.io/${GITHUB_REPOSITORY,,}/${image}"
            recorded_digest="$(cat "$RUNNER_TEMP/candidate-digests/candidate-digest-${image}/${image}")"
            if [ -z "$recorded_digest" ]; then
              echo "::error::empty recorded digest for ${image}" >&2
              failed=1
              continue
            fi
            for alias in "${VERSION}" latest; do
              alias_digest="$(docker buildx imagetools inspect \
                --format '{{json .Manifest.Digest}}' "${pdpp_image}:${alias}")"
              echo "${pdpp_image}:${alias} -> ${alias_digest} (recorded \"${recorded_digest}\")"
              if [ "${alias_digest}" != "\"${recorded_digest}\"" ]; then
                echo "::error::${pdpp_image}:${alias} does not match the recorded candidate digest for ${image}" >&2
                failed=1
              fi
            done
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::release channel is not fully promoted; re-run the failed promote-release-images matrix legs" >&2
            exit 1
          fi
