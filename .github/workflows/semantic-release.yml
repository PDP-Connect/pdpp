name: semantic-release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: semantic-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-version:
    name: resolve next version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    outputs:
      new-release-published: ${{ steps.version.outputs.new-release-published }}
      new-release-version: ${{ steps.version.outputs.new-release-version }}
      new-release-git-tag: ${{ steps.version.outputs.new-release-git-tag }}
      new-release-major-minor: ${{ steps.version.outputs.new-release-major-minor }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies
        env:
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Determine next version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          pnpm exec semantic-release --dry-run 2>&1 | tee "$RUNNER_TEMP/semantic-release-dry-run.log"
          node --import tsx scripts/semantic-release-github-output.ts dry-run "$RUNNER_TEMP/semantic-release-dry-run.log"

  quality:
    name: release quality checks
    needs: resolve-version
    if: needs.resolve-version.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: "pnpm"

      # --ignore-scripts is deliberate here: a normal `pnpm install` runs every
      # workspace package's `prepare` script, and packages/cli's `prepare`
      # runs `pnpm build`, which REGENERATES packages/cli/src/ref/
      # list-envelope.ts from packages/list-envelope/src/index.ts before any
      # later drift check would ever see the tracked file's real committed
      # state. Checking drift after a scripted install would silently
      # normalize (and thus never catch) exactly the drift this check exists
      # to find. node_modules from this pass is sufficient for
      # generated-artifacts:check (tsx + tsc, no package builds needed).
      - name: Install dependencies (no lifecycle scripts, for drift check)
        env:
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check generated artifacts are not drifted (before any build/prepack normalizes them)
        run: pnpm generated-artifacts:check

      - name: Install dependencies
        env:
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Verify generated reference contract
        run: pnpm reference-contract:check-generated

      - name: Typecheck reference implementation
        run: pnpm --dir reference-implementation run typecheck

      - name: Check spec docs drift
        run: pnpm spec:check

      - name: Check package release policy
        run: pnpm release:policy-check

      - name: Test package release policy checks
        run: pnpm release:policy-check:test

      - name: Test dist-tag posture classifier
        run: pnpm release:dist-tag-check:test

      - name: Check Docker release matrix consistency
        run: pnpm docker:release-matrix:check

      - name: Test Docker release matrix consistency checks
        run: pnpm docker:release-matrix:check:test

      - name: Test self-host bundle generator
        run: pnpm docker:release-bundle:test

      - name: Test self-host bundle publish verification
        run: pnpm docker:release-bundle:verify-published:test

      - name: Typecheck operator console app
        run: pnpm --dir apps/console run types:check

      - name: Verify CLI package
        run: pnpm --filter @pdpp/cli run verify

      - name: Verify local collector package
        run: pnpm --filter @pdpp/local-collector run verify

      - name: Verify MCP server package
        run: pnpm --filter @pdpp/mcp-server run verify

      - name: Verify read-core package
        run: pnpm --filter @pdpp/read-core run verify

  validate-release-images:
    name: validate release image ${{ matrix.image }}
    needs: resolve-version
    if: needs.resolve-version.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: reference
            target: reference
            title: PDPP reference AS/RS
            description: PDPP reference authorization server and resource server
          - image: reference-browser
            target: reference-browser
            title: PDPP reference AS/RS (browser-capable)
            description: PDPP reference AS/RS with Patchright/Chromium for browser-backed connectors (ChatGPT, USAA, ...)
          - image: web
            target: console
            title: PDPP reference operator console
            description: PDPP browser-facing reference operator console
          # The single-container self-host node. Without it in this matrix the
          # one-command `docker run` path could only ever reference `:main` or
          # `sha-*` from a manual docker-images dispatch, so the image the
          # self-host docs recommend had no immutable released tag at all.
          - image: railway-core
            target: railway-core
            title: PDPP Core node (single container)
            description: PDPP single-container Core node (AS/RS + operator console) for one-command self-hosting
          # Same single-container node plus Chromium, for owners who want
          # browser-backed connectors without assembling a Compose stack.
          - image: core-browser
            target: core-browser
            title: PDPP Core node (single container, browser-capable)
            description: PDPP single-container Core node with Patchright/Chromium for browser-backed connectors
          - image: neko
            dockerfile: ./docker/neko/Dockerfile
            target: neko-runtime
            title: PDPP browser surface (n.eko)
            description: PDPP viewable browser surface (n.eko + Patchright Chromium) for browser-backed connectors

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image name
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          echo "PDPP_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      # No QEMU here: this validate build is amd64-only (see platforms below),
      # so cross-arch emulation isn't needed. The publish-images job keeps QEMU
      # because it builds multi-arch.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.PDPP_IMAGE }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.resolve-version.outputs.new-release-version }}
          tags: |
            type=raw,value=${{ needs.resolve-version.outputs.new-release-version }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          cache-from: |
            type=gha,scope=${{ matrix.target }}-release
            type=gha,scope=reference-release
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-release
          context: .
          file: ${{ matrix.dockerfile || './Dockerfile' }}
          build-args: |
            PDPP_REFERENCE_REVISION=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          # amd64-only for this validate build (push: false). It's a
          # constructability smoke test, and the arm64 Chromium/Patchright build
          # adds 10-24 min with no CI value here. The publish-images job below
          # stays multi-arch (linux/amd64,linux/arm64).
          platforms: linux/amd64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          target: ${{ matrix.target }}

  release:
    name: publish GitHub and npm release
    needs: [resolve-version, quality]
    if: needs.resolve-version.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    outputs:
      published: ${{ steps.semantic-release.outputs.new-release-published }}
      version: ${{ steps.semantic-release.outputs.new-release-version }}
      git-tag: ${{ steps.semantic-release.outputs.new-release-git-tag }}
      major-minor: ${{ steps.semantic-release.outputs.new-release-major-minor }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies
        env:
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Run semantic-release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release

  publish-images:
    name: publish release image ${{ matrix.image }}
    needs: [release, validate-release-images]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: reference
            target: reference
            title: PDPP reference AS/RS
            description: PDPP reference authorization server and resource server
          - image: reference-browser
            target: reference-browser
            title: PDPP reference AS/RS (browser-capable)
            description: PDPP reference AS/RS with Patchright/Chromium for browser-backed connectors (ChatGPT, USAA, ...)
          - image: web
            target: console
            title: PDPP reference operator console
            description: PDPP browser-facing reference operator console
          # The single-container self-host node. Without it in this matrix the
          # one-command `docker run` path could only ever reference `:main` or
          # `sha-*` from a manual docker-images dispatch, so the image the
          # self-host docs recommend had no immutable released tag at all.
          - image: railway-core
            target: railway-core
            title: PDPP Core node (single container)
            description: PDPP single-container Core node (AS/RS + operator console) for one-command self-hosting
          # Same single-container node plus Chromium, for owners who want
          # browser-backed connectors without assembling a Compose stack.
          - image: core-browser
            target: core-browser
            title: PDPP Core node (single container, browser-capable)
            description: PDPP single-container Core node with Patchright/Chromium for browser-backed connectors
          - image: neko
            dockerfile: ./docker/neko/Dockerfile
            target: neko-runtime
            title: PDPP browser surface (n.eko)
            description: PDPP viewable browser surface (n.eko + Patchright Chromium) for browser-backed connectors

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image name
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          echo "PDPP_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.PDPP_IMAGE }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
          tags: |
            type=raw,value=${{ needs.release.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          cache-from: |
            type=gha,scope=${{ matrix.target }}-release
            type=gha,scope=reference-release
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-release
          context: .
          file: ${{ matrix.dockerfile || './Dockerfile' }}
          build-args: |
            PDPP_REFERENCE_REVISION=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          target: ${{ matrix.target }}

  publish-selfhost-bundle:
    name: publish version-coherent self-host bundle
    needs: [release, publish-images]
    # publish-images already gates on needs.release.outputs.published, and
    # this job needs every one of its matrix legs to have actually pushed —
    # a partial success here (e.g. neko's build fails but reference/web
    # succeed) must NOT publish a bundle that references a digest that was
    # never pushed. `needs` on a matrix job blocks until ALL legs finish;
    # `result == 'success'` requires ALL legs to have succeeded.
    if: needs.publish-images.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies
        env:
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      # publish-images pushed each image tagged with the exact release
      # version (`type=raw,value=${{ needs.release.outputs.version }}`), so
      # resolving THAT tag's digest right now — rather than threading a
      # per-matrix-leg output out of publish-images, which GitHub Actions
      # matrix jobs cannot do without a leg-name-keyed output map — gets the
      # exact digest this release just pushed. Uses the same GHCR
      # anonymous-token probe as verify-published-docker-images.ts.
      - name: Resolve this release's published image digests
        id: digests
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          for image in reference web neko; do
            token=$(curl -fsS "https://ghcr.io/token?scope=repository:pdp-connect/pdpp/${image}:pull&service=ghcr.io" | node -e "process.stdin.on('data',d=>process.stdout.write(JSON.parse(d).token))")
            digest=$(curl -fsSI \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://ghcr.io/v2/pdp-connect/pdpp/${image}/manifests/${RELEASE_VERSION}" \
              | tr -d '\r' | grep -i '^docker-content-digest:' | cut -d' ' -f2)
            if [[ -z "${digest}" ]]; then
              echo "::error::could not resolve a published digest for ${image}:${RELEASE_VERSION}"
              exit 1
            fi
            echo "${image}=${digest}" >> "$GITHUB_OUTPUT"
          done

      - name: Generate version-coherent self-host bundle
        run: |
          mkdir -p .release-bundle
          pnpm docker:release-bundle:generate -- \
            --version "${{ needs.release.outputs.version }}" \
            --image "reference=${{ steps.digests.outputs.reference }}" \
            --image "web=${{ steps.digests.outputs.web }}" \
            --image "neko=${{ steps.digests.outputs.neko }}" \
            --out .release-bundle/docker-compose.yml

      - name: Upload bundle to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release.outputs.git-tag }}" \
            .release-bundle/docker-compose.yml \
            --clobber

      - name: Verify the published bundle is version-coherent and pullable
        run: pnpm docker:release-bundle:verify-published -- --tag "${{ needs.release.outputs.git-tag }}"
