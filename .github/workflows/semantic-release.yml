name: semantic-release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: semantic-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-version:
    name: resolve next version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    outputs:
      new-release-published: ${{ steps.version.outputs.new-release-published }}
      new-release-version: ${{ steps.version.outputs.new-release-version }}
      new-release-git-tag: ${{ steps.version.outputs.new-release-git-tag }}
      new-release-major-minor: ${{ steps.version.outputs.new-release-major-minor }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies
        env:
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Determine next version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          pnpm exec semantic-release --dry-run 2>&1 | tee "$RUNNER_TEMP/semantic-release-dry-run.log"
          node --import tsx scripts/semantic-release-github-output.ts dry-run "$RUNNER_TEMP/semantic-release-dry-run.log"

  quality:
    name: release quality checks
    needs: resolve-version
    if: needs.resolve-version.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: "pnpm"

      # --ignore-scripts is deliberate here: a normal `pnpm install` would run
      # every workspace package's `prepare` script before any later drift
      # check ever saw a tracked file's real committed state, which could
      # silently normalize (and thus never catch) generated-artifact drift.
      # node_modules from this pass is sufficient for generated-artifacts:check
      # (tsx + tsc, no package builds needed).
      - name: Install dependencies (no lifecycle scripts, for drift check)
        env:
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check generated artifacts are not drifted (before any build/prepack normalizes them)
        run: pnpm generated-artifacts:check

      - name: Install dependencies
        env:
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Verify generated reference contract
        run: pnpm reference-contract:check-generated

      - name: Check spec docs drift
        run: pnpm spec:check

      - name: Check package release policy
        run: pnpm release:policy-check

      - name: Test package release policy checks
        run: pnpm release:policy-check:test

      - name: Test dist-tag posture classifier
        run: pnpm release:dist-tag-check:test

  release:
    name: publish GitHub and npm release
    needs: [resolve-version, quality]
    if: needs.resolve-version.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    outputs:
      published: ${{ steps.semantic-release.outputs.new-release-published }}
      version: ${{ steps.semantic-release.outputs.new-release-version }}
      git-tag: ${{ steps.semantic-release.outputs.new-release-git-tag }}
      major-minor: ${{ steps.semantic-release.outputs.new-release-major-minor }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies
        env:
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Run semantic-release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release
