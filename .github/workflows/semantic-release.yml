name: semantic-release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: semantic-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-version:
    name: resolve next version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    outputs:
      new-release-published: ${{ steps.version.outputs.new-release-published }}
      new-release-version: ${{ steps.version.outputs.new-release-version }}
      new-release-git-tag: ${{ steps.version.outputs.new-release-git-tag }}
      new-release-major-minor: ${{ steps.version.outputs.new-release-major-minor }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies
        env:
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Determine next version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          pnpm exec semantic-release --dry-run 2>&1 | tee "$RUNNER_TEMP/semantic-release-dry-run.log"
          node --import tsx scripts/semantic-release-github-output.ts dry-run "$RUNNER_TEMP/semantic-release-dry-run.log"

  quality:
    name: release quality checks
    needs: resolve-version
    if: needs.resolve-version.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: "pnpm"

      # --ignore-scripts is deliberate here: a normal `pnpm install` runs every
      # workspace package's `prepare` script, and packages/cli's `prepare`
      # runs `pnpm build`, which REGENERATES packages/cli/src/ref/
      # list-envelope.ts from packages/list-envelope/src/index.ts before any
      # later drift check would ever see the tracked file's real committed
      # state. Checking drift after a scripted install would silently
      # normalize (and thus never catch) exactly the drift this check exists
      # to find. node_modules from this pass is sufficient for
      # generated-artifacts:check (tsx + tsc, no package builds needed).
      - name: Install dependencies (no lifecycle scripts, for drift check)
        env:
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check generated artifacts are not drifted (before any build/prepack normalizes them)
        run: pnpm generated-artifacts:check

      - name: Install dependencies
        env:
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Verify generated reference contract
        run: pnpm reference-contract:check-generated

      - name: Typecheck reference implementation
        run: pnpm --dir reference-implementation run typecheck

      - name: Check spec docs drift
        run: pnpm spec:check

      - name: Check package release policy
        run: pnpm release:policy-check

      - name: Test package release policy checks
        run: pnpm release:policy-check:test

      - name: Test dist-tag posture classifier
        run: pnpm release:dist-tag-check:test

      - name: Typecheck operator console app
        run: pnpm --dir apps/console run types:check

      - name: Verify CLI package
        run: pnpm --filter @pdpp/cli run verify

      - name: Verify local collector package
        run: pnpm --filter @pdpp/local-collector run verify

      - name: Verify MCP server package
        run: pnpm --filter @pdpp/mcp-server run verify

      - name: Verify read-core package
        run: pnpm --filter @pdpp/read-core run verify

  validate-release-images:
    name: validate release image ${{ matrix.image }}
    needs: resolve-version
    if: needs.resolve-version.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: reference
            target: reference
            title: PDPP reference AS/RS
            description: PDPP reference authorization server and resource server
          - image: reference-browser
            target: reference-browser
            title: PDPP reference AS/RS (browser-capable)
            description: PDPP reference AS/RS with Patchright/Chromium for browser-backed connectors (ChatGPT, USAA, ...)
          - image: web
            target: console
            title: PDPP reference operator console
            description: PDPP browser-facing reference operator console
          - image: core
            target: core
            title: PDPP Core node
            description: PDPP platform-neutral single-container Core node with console and loopback AS/RS

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image name
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          echo "PDPP_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      # No QEMU here: this validate build is amd64-only (see platforms below),
      # so cross-arch emulation isn't needed. The publish-images job keeps QEMU
      # because it builds multi-arch.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.PDPP_IMAGE }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.resolve-version.outputs.new-release-version }}
          tags: |
            type=raw,value=${{ needs.resolve-version.outputs.new-release-version }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          cache-from: |
            type=gha,scope=${{ matrix.target }}-release
            type=gha,scope=reference-release
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-release
          context: .
          file: ./Dockerfile
          build-args: |
            PDPP_REFERENCE_REVISION=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          # amd64-only for this validate build (push: false). It's a
          # constructability smoke test, and the arm64 Chromium/Patchright build
          # adds 10-24 min with no CI value here. The publish-images job below
          # stays multi-arch (linux/amd64,linux/arm64).
          platforms: linux/amd64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          target: ${{ matrix.target }}

  release:
    name: publish GitHub and npm release
    needs: [resolve-version, quality, publish-candidate-images]
    if: needs.resolve-version.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    outputs:
      published: ${{ steps.semantic-release.outputs.new-release-published }}
      version: ${{ steps.semantic-release.outputs.new-release-version }}
      git-tag: ${{ steps.semantic-release.outputs.new-release-git-tag }}
      major-minor: ${{ steps.semantic-release.outputs.new-release-major-minor }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies
        env:
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Run semantic-release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release

  # Publishes the candidate images BEFORE semantic-release creates the GitHub
  # release and git tag. Ordering is the whole point: when this job ran after
  # `release`, an image build that failed left a published GitHub release and
  # tag advertising a version whose images never existed, and the only repair
  # was to delete a public release. Building first makes the failure mode
  # "no release happened", which is recoverable by pushing again.
  #
  # Only immutable tags are written here (the candidate version and sha-<rev>).
  # `latest` is deliberately NOT in this tag list: a moving channel tag must
  # not advertise a version that semantic-release has not yet committed to.
  # The promote-release-images job below moves `latest` onto the exact manifest
  # this job published, after the release succeeds.
  publish-candidate-images:
    name: publish candidate image ${{ matrix.image }}
    needs: [resolve-version, quality, validate-release-images]
    if: needs.resolve-version.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: reference
            target: reference
            title: PDPP reference AS/RS
            description: PDPP reference authorization server and resource server
          - image: reference-browser
            target: reference-browser
            title: PDPP reference AS/RS (browser-capable)
            description: PDPP reference AS/RS with Patchright/Chromium for browser-backed connectors (ChatGPT, USAA, ...)
          - image: web
            target: console
            title: PDPP reference operator console
            description: PDPP browser-facing reference operator console
          - image: core
            target: core
            title: PDPP Core node
            description: PDPP platform-neutral single-container Core node with console and loopback AS/RS

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image name
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          echo "PDPP_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.PDPP_IMAGE }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.resolve-version.outputs.new-release-version }}
          tags: |
            type=raw,value=${{ needs.resolve-version.outputs.new-release-version }}
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          cache-from: |
            type=gha,scope=${{ matrix.target }}-release
            type=gha,scope=reference-release
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-release
          context: .
          file: ./Dockerfile
          build-args: |
            PDPP_REFERENCE_REVISION=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          target: ${{ matrix.target }}

  # Moves the `latest` channel tag onto the EXACT manifest that
  # publish-candidate-images already pushed, once semantic-release has actually
  # created the release. This is a registry-side manifest copy, not a rebuild:
  # `docker buildx imagetools create -t <dst> <src>` copies the source manifest
  # list by digest, so `latest` and the immutable version tag are guaranteed to
  # be the same bytes — multi-arch entries, SBOM and provenance attestations
  # included. Rebuilding here would instead produce a second, differently-built
  # image under `latest` that no immutable tag points at.
  promote-release-images:
    name: promote ${{ matrix.image }} to latest
    needs: [release, publish-candidate-images]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        image: [reference, reference-browser, web, core]

    steps:
      - name: Compute image name
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          echo "PDPP_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Fail before touching `latest` if the candidate is missing. Without this,
      # a promotion typo would surface as a confusing imagetools error after
      # the release already exists.
      - name: Verify the candidate manifest exists
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${PDPP_IMAGE}:${VERSION}" > /dev/null

      - name: Promote candidate to latest
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${PDPP_IMAGE}:latest" \
            "${PDPP_IMAGE}:${VERSION}"

      # Proves the promotion actually landed: `latest` must now resolve to the
      # same digest as the immutable candidate tag. A silent no-op or a partial
      # copy fails here rather than shipping a stale `latest` to every operator
      # whose onboarding docs name that tag.
      - name: Verify latest resolves to the promoted manifest
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          candidate_digest="$(docker buildx imagetools inspect \
            --format '{{json .Manifest.Digest}}' "${PDPP_IMAGE}:${VERSION}")"
          latest_digest="$(docker buildx imagetools inspect \
            --format '{{json .Manifest.Digest}}' "${PDPP_IMAGE}:latest")"
          echo "candidate ${PDPP_IMAGE}:${VERSION} -> ${candidate_digest}"
          echo "promoted  ${PDPP_IMAGE}:latest -> ${latest_digest}"
          if [ "${candidate_digest}" != "${latest_digest}" ]; then
            echo "::error::latest does not resolve to the promoted candidate manifest" >&2
            exit 1
          fi
