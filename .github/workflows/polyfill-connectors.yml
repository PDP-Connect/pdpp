name: polyfill-connectors

# Path-scoped CI for packages/polyfill-connectors/**. Initially non-blocking
# per the owner response memo (Tranche B Item #11) — "do not treat it as a
# required merge gate until it has been stable for a short proving period."
# Promote to required in repo settings once this workflow has a clean record.

on:
  push:
    branches: [main]
    paths:
      - "packages/polyfill-connectors/**"
      - "reference-implementation/fixtures/seed-manifests/**"
      - ".github/workflows/polyfill-connectors.yml"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "packages/polyfill-connectors/**"
      - "reference-implementation/fixtures/seed-manifests/**"
      - ".github/workflows/polyfill-connectors.yml"
      - "pnpm-lock.yaml"
  workflow_dispatch: {}

concurrency:
  group: polyfill-connectors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  write-freeze-guard:
    # Move A ownership flip: connector source now begins in
    # PDP-Connect/data-connectors. This repo's copy keeps running the
    # product (DUALHOME-AUDIT.md: ~150 consuming files) but is frozen for
    # direct connector-source edits. Fails a PR that touches connector
    # source under packages/polyfill-connectors/connectors/** unless it
    # carries the `connector-write-freeze-override` label. Deliberately
    # narrower than the workflow's own path trigger: fixtures, docs, and
    # scripts changes are not source edits and are not frozen.
    name: write-freeze guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for frozen-path connector source edits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HAS_OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'connector-write-freeze-override') }}
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 'packages/polyfill-connectors/connectors/**')
          if [ -z "$CHANGED" ]; then
            echo "No frozen connector-source paths touched."
            exit 0
          fi
          echo "Frozen connector-source paths touched:"
          echo "$CHANGED"
          if [ "$HAS_OVERRIDE" = "true" ]; then
            echo "connector-write-freeze-override label present — allowing."
            exit 0
          fi
          echo ""
          echo "packages/polyfill-connectors/connectors/ is frozen for direct edits."
          echo "Connector work now begins in PDP-Connect/data-connectors — see AUTHORING.md there."
          echo "Add the 'connector-write-freeze-override' label if this PR is an intentional exception."
          exit 1

  verify:
    name: verify + test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        # Reads packageManager from the repo-root package.json (pnpm@10.33.0).
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 24 LTS. Matches the node:test + --test-timeout features
          # the package relies on and keeps CI on a supported LTS.
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        # Monorepo root install so pnpm workspace resolves @pdpp/* packages.
        # --frozen-lockfile catches drift between pnpm-lock.yaml and
        # package.json without letting CI silently upgrade deps.
        # The postinstall browser downloads (~150MB each) stay off: this job
        # needs ONE browser, installed explicitly in the next step, not two
        # pulled implicitly on every install.
        #
        # This previously read "verify + test don't spin up a browser". That
        # stopped being true when `src/capture-trace-redaction.test.ts` began
        # importing `chromium` from `playwright` and launching it for real, to
        # prove a trace zip cannot leak a credential. Six of its tests failed
        # in CI with "Executable doesn't exist" for as long as the run reached
        # them — which it only started doing once an earlier `verify` failure
        # stopped short-circuiting the chain.
        env:
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for the capture-redaction proofs
        # `src/capture-trace-redaction.test.ts` launches a real browser: the
        # thing under test is what Playwright WRITES to disk (trace zips,
        # screenshots, DOM snapshots), so a stub cannot prove the redaction.
        # `--with-deps` because the runner image carries no shared libs for it.
        # Run from the package: `playwright` is a dependency of
        # polyfill-connectors, not of the workspace root, so `pnpm exec
        # playwright` at the root resolves to patchright instead.
        run: pnpm --dir packages/polyfill-connectors exec playwright install --with-deps chromium

      - name: Verify (typecheck + biome check)
        run: pnpm --dir packages/polyfill-connectors run verify

      - name: Test
        # The package script runs at two isolated test-file processes. This
        # bounds contention from connector tests that launch child processes
        # while retaining a finite 120s runner timeout for an unguarded hang.
        run: pnpm --dir packages/polyfill-connectors run test
