name: docker-images

# This workflow validates that the image matrix still builds, and offers a
# manual diagnostic publish. It is deliberately NOT a release publisher.
#
# There is no `tags: ["v*"]` trigger. semantic-release.yml owns the release
# channel end to end: it publishes immutable tags BEFORE creating the git tag,
# then promotes `latest` by copying that exact manifest. A `v*` trigger here
# would make this workflow a second, independent publisher of `latest` racing
# that promotion - and because it rebuilds from source, the winner could be
# bytes that no immutable tag points at. Single owner for `latest`, by
# construction rather than by timing.
on:
  push:
    branches: [main]
    # reference-implementation/** is intentionally excluded to avoid rebuilding
    # 4 images on every ref-impl commit (the repo's single largest CI cost).
    # Coverage is preserved elsewhere:
    #   - The console Docker image transpiles pdpp-reference-implementation, so
    #     ref-impl changes CAN affect a Docker console build. That path is
    #     exercised by reference-implementation.yml, which runs the console
    #     standalone/integration builds on every ref-impl change.
    #   - The release pipeline's validate-release-images job (semantic-release.yml)
    #     still builds all Docker images before any publish.
    # So removing this trigger trades earlier-but-redundant Docker feedback for a
    # large cost saving, without losing build-safety on a real release.
    paths:
      - ".dockerignore"
      - ".env.docker.example"
      - ".github/workflows/docker-images.yml"
      - "Dockerfile"
      - "apps/console/**"
      - "deploy/railway/**"
      - "docker/neko/**"
      - "docker-compose*.yml"
      - "package.json"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/check-railway-template-artifacts.test.ts"
      - "scripts/core-headed-patchright-runtime-oracle.sh"
      - "scripts/core-headed-patchright-runtime-oracle.test.ts"
      - "scripts/core-headed-patchright-runtime-oracle.ts"
      - "scripts/docker-smoke.sh"
      - "scripts/published-*-smoke.sh"
  pull_request:
    # See the push trigger above: reference-implementation/** is excluded on
    # purpose so ref-impl-only changes don't rebuild the Docker image matrix.
    paths:
      - ".dockerignore"
      - ".env.docker.example"
      - ".github/workflows/docker-images.yml"
      - "Dockerfile"
      - "apps/console/**"
      - "deploy/railway/**"
      - "docker/neko/**"
      - "docker-compose*.yml"
      - "package.json"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/check-railway-template-artifacts.test.ts"
      - "scripts/core-headed-patchright-runtime-oracle.sh"
      - "scripts/core-headed-patchright-runtime-oracle.test.ts"
      - "scripts/core-headed-patchright-runtime-oracle.ts"
      - "scripts/docker-smoke.sh"
      - "scripts/published-*-smoke.sh"
  workflow_dispatch:
    inputs:
      image:
        description: Image to build on manual dispatch
        required: false
        default: all
        type: choice
        options:
          - all
          - reference
          - reference-browser
          - web
          - core
      platforms:
        description: Publish platforms on manual dispatch
        required: false
        default: linux/amd64,linux/arm64
        type: string

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patchright-lockstep:
    name: patchright/browser version lockstep
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        env:
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      # Static oracle: fails closed if the Dockerfile/n.eko image ever
      # hardcodes a Patchright/Chromium version instead of deriving it from
      # packages/polyfill-connectors/package.json (the one source of truth
      # the reference-implementation runtime loads at import time).
      - name: Prove Dockerfile and n.eko derive Patchright from the workspace manifest
        run: pnpm railway:template:test

  validate:
    name: validate ${{ matrix.image }}
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: reference
            target: reference
            title: PDPP reference AS/RS
            description: PDPP reference authorization server and resource server
          - image: web
            target: console
            title: PDPP reference operator console
            description: PDPP browser-facing reference operator console
          - image: reference-browser
            target: reference-browser
            title: PDPP reference AS/RS (browser-capable)
            description: PDPP reference AS/RS with Patchright/Chromium for browser-backed connectors (ChatGPT, USAA, ...)
          - image: core
            target: core
            title: PDPP Core node
            description: PDPP platform-neutral single-container Core node with console and loopback AS/RS

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.image == 'all' || github.event.inputs.image == matrix.image
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Compute image name
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          echo "PDPP_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.PDPP_IMAGE }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # Build-only tag names (push: false below), so these never reach the
          # registry. No semver/latest entries: this workflow has no tag
          # trigger and must never name a release channel tag, even locally.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          # Pull from both the target's own scope and the reference scope.
          # reference-browser extends the browsers stage (large ~300 MB layer)
          # and shares the base layers with reference; pulling from both scopes
          # lets BuildKit reuse those layers without rebuilding them.
          cache-from: |
            type=gha,scope=${{ matrix.target }}
            type=gha,scope=reference
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          context: .
          file: ./Dockerfile
          build-args: |
            PDPP_REFERENCE_REVISION=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          load: ${{ matrix.image == 'core' }}
          platforms: linux/amd64
          push: false
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ matrix.image == 'core' && 'pdpp:ci-core-test' || '' }}
          target: ${{ matrix.target }}

      # Fails before any other core-image check if the OCI revision label and
      # the runtime PDPP_REFERENCE_REVISION disagree, are missing, or are
      # "unknown" — the retained production Core image shipped with an
      # unknown label while its runtime revision was set correctly, so no
      # live acceptance result could be attributed to a commit. This is a CI
      # build (github.sha is always real), so --require-known is correct
      # here; only intentional local dev builds use --allow-unknown.
      - name: Prove the built core image carries one non-unknown revision in both the OCI label and the runtime env
        if: matrix.image == 'core'
        run: bash deploy/docker/check-image-identity.sh --require-known pdpp:ci-core-test

      - name: Test core image (slackdump bundling, license, builder isolation)
        if: matrix.image == 'core'
        env:
          PDPP_CORE_IMAGE_TAG: pdpp:ci-core-test
        run: |
          node --experimental-strip-types scripts/test-scratch/run-command.ts -- node --test scripts/docker-slackdump-core-bundle.test.ts

      # Runtime oracle: proves the exact image just built actually contains
      # a launchable full-Chromium Patchright binary (not a headless-shell
      # substitution and not a stale pinned revision), owns its managed
      # display and profile, and survives a restart. Reuses the image loaded
      # above instead of paying for a second build.
      - name: Prove Core's built image launches a persistent Patchright/Chromium context
        if: matrix.image == 'core'
        env:
          PDPP_CORE_ORACLE_IMAGE: pdpp:ci-core-test
          PDPP_CORE_ORACLE_SKIP_BUILD: "1"
        run: bash scripts/core-headed-patchright-runtime-oracle.sh

  # Manual diagnostic publish ONLY - never a release publisher.
  #
  # Reachable exclusively via workflow_dispatch, and it writes exactly one
  # immutable, clearly-marked tag: dispatch-sha-<rev>. It cannot write
  # `latest`, a bare version, or a semver tag, so a maintainer debugging a
  # registry-side problem can never collide with the release channel that
  # semantic-release.yml owns. The old refs/tags/v ref gate is gone along with
  # the v* trigger it served.
  publish:
    name: publish diagnostic image ${{ matrix.image }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: reference
            target: reference
            title: PDPP reference AS/RS
            description: PDPP reference authorization server and resource server
          - image: reference-browser
            target: reference-browser
            title: PDPP reference AS/RS (browser-capable)
            description: PDPP reference AS/RS with Patchright/Chromium for browser-backed connectors (ChatGPT, USAA, ...)
          - image: web
            target: console
            title: PDPP reference operator console
            description: PDPP browser-facing reference operator console
          - image: core
            target: core
            title: PDPP Core node
            description: PDPP platform-neutral single-container Core node with console and loopback AS/RS

    steps:
      - name: Checkout
        if: github.event.inputs.image == 'all' || github.event.inputs.image == matrix.image
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image name
        if: github.event.inputs.image == 'all' || github.event.inputs.image == matrix.image
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          echo "PDPP_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        if: github.event.inputs.image == 'all' || github.event.inputs.image == matrix.image
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        if: github.event.inputs.image == 'all' || github.event.inputs.image == matrix.image
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: github.event.inputs.image == 'all' || github.event.inputs.image == matrix.image
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: github.event.inputs.image == 'all' || github.event.inputs.image == matrix.image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.PDPP_IMAGE }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # One immutable, dispatch-scoped tag. The dispatch- prefix keeps a
          # manual diagnostic image from ever being mistaken for, or
          # overwriting, a released tag. The moving channel tag, semver
          # patterns and the bare sha- release tag are intentionally absent:
          # semantic-release.yml is the only publisher permitted to write them.
          tags: |
            type=sha,prefix=dispatch-sha-

      - name: Build and push image
        if: github.event.inputs.image == 'all' || github.event.inputs.image == matrix.image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          # Pull from both the target's own scope and the reference scope.
          # reference-browser extends the browsers stage (large ~300 MB layer)
          # and shares the base layers with reference; pulling from both scopes
          # lets BuildKit reuse those layers without rebuilding them.
          cache-from: |
            type=gha,scope=${{ matrix.target }}
            type=gha,scope=reference
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          context: .
          file: ./Dockerfile
          build-args: |
            PDPP_REFERENCE_REVISION=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          target: ${{ matrix.target }}
