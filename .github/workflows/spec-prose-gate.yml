name: spec-prose-gate

on:
  pull_request:
    paths:
      - ".github/workflows/spec-prose-gate.yml"
      - "scripts/spec-prose-lint.mjs"
      - "scripts/spec-prose-lint.test.mjs"
      - "spec-*.md"
  workflow_dispatch: {}

concurrency:
  group: spec-prose-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-prose-gate:
    name: spec prose rules
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate lints only the spec files this pull request touches, so it
          # needs the base commit present to diff against. A depth-1 checkout
          # would have no base and the diff would name every file.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      # The linter itself needs no dependencies, but the unit tests run through
      # the scratch owner (`pnpm test:scratch`), which the canonical-entrypoint
      # ratchet requires for every `node --test` invocation in this repository.
      - name: Install dependencies
        env:
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Test the linter
        run: pnpm test:scratch -- node --test scripts/spec-prose-lint.test.mjs

      - name: Lint changed spec files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ]; then
            changed="$(git diff --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD -- 'spec-*.md')"
          else
            changed="$(ls spec-*.md 2>/dev/null || true)"
          fi
          if [ -z "$changed" ]; then
            echo "No spec-*.md changed in this pull request; nothing to check."
            exit 0
          fi
          echo "Checking:"
          echo "$changed" | sed 's/^/  /'
          # Word-split is intended: the linter takes a file list.
          # shellcheck disable=SC2086
          node scripts/spec-prose-lint.mjs $changed
