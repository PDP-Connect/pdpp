<!DOCTYPE html>
<!--
  The promotional "what's new" interstitial observed over an AUTHENTICATED
  orders page, reduced to the elements that drive surface classification.

  Live shape captured at
  /root/.pdpp/fixture-captures/heb/raw/2026-08-19T03-18-07-656Z/dom/runtime-collect-start.html
  in container `pdpp-core-prod-drain` (url https://www.heb.com/my-account/your-orders,
  title "Your orders | HEB.com"). Owner name, email, account id, cart, and store
  were stripped; the promo copy is H-E-B's own marketing text and carries no
  personal data.

  This is the surface that made the connector ask the owner to sign in when the
  session was already live. The page underneath is authenticated — `orderResults`
  is present and populated — but the modal is portaled to <body> OUTSIDE the
  Next.js root, steals focus, and covers the order content.

  Load-bearing structure, in the order the classifier reads it:

    * The dialog is `[data-component="modal-content"][role="dialog"][aria-modal="true"]`.
      `data-component` is H-E-B's own component hook; the CSS-module class
      suffixes (`__o_tcp`) are BUILD HASHES that rotate on every deploy, so they
      must never be matched.
    * The close control is `[data-qe-id="modalClose"]` — H-E-B's QA-engineering
      id, and the most durable dismissal hook on the page. Note its accessible
      name is "Close Modal", not "Close".
    * The skin class is `WhatsNewModal_`, a GENERIC announcement slot. Future
      promos will reuse this chassis with entirely different copy, so nothing
      here keys on "fastest delivery" or "$9.95".

  The modal is a SIBLING of `[data-qe-id="orderResults"]`, never nested inside
  it. That is what keeps it structurally distinct from the source-authored empty
  state (`OrderEmpty_`/`Empty_box` INSIDE `orderResults`) — the two cannot be
  confused by construction, not merely by ordering.
-->
