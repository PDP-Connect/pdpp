<!-- Callum's mark, bare. No background plate: the owner asked for none, and the
     two-tone glyph does not need one. A mark in a single flat colour cannot clear
     3:1 against both light and dark tab chrome - brightening the blue for Chrome
     dark always breaks it on Chrome light, and vice versa - but a two-tone mark
     only needs ONE tone to carry on any given chrome. Copper carries the light
     chromes (4.17 Chrome, 5.06 Safari, 5.20 Firefox) and blue carries the dark
     ones (2.62 Chrome, 3.08 Safari, 3.71 Firefox), so the glyph stays readable
     either way. Verified by rendering at 16/32/48px on real tab-strip colours
     and looking at the result: the counter stays open at 16px.
     Colours and geometry match brand/pdpp-mark.svg, which is what the masthead,
     apple-icon and OG card already ship - oklch converted to sRGB because
     next/og's satori renderer does not support oklch(). -->
<!-- biome-ignore lint/a11y/noSvgWithoutTitle: decorative favicon; the accessible name lives on the link that renders the mark. -->
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <path d="M 40 30 L 40 170 L 60 170 L 60 116 L 100 116 Q 105 116 105 110 L 105 30 Z" fill="#a05533" />
  <path
    d="M 105 30 L 105 110 Q 105 116 100 116 L 60 116 L 60 170 L 80 170 L 80 136 L 125 136 Q 155 136 155 103 Q 155 30 105 30 Z"
    fill="#2c73d9"
  />
  <circle cx="105" cy="73" fill="#fbfaf5" r="18" />
</svg>
